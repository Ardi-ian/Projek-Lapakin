<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lapakin - Marketplace</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f4f6f8; color: #222; }
    header { background: #03ac0e; color: #fff; position: sticky; top: 0; z-index: 5; }
    .bar { max-width: 1000px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .logo { font-size: 22px; font-weight: bold; cursor: pointer; }
    nav { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-left: auto; }
    nav a, nav span { padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; }
    nav a:hover, nav a.on { background: rgba(255,255,255,.25); }
    nav span { cursor: default; opacity: .9; }
    main { max-width: 1000px; margin: 20px auto; padding: 0 16px; }
    h2 { margin: 0 0 14px; }
    .card { background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
    .produk h3 { margin: 0 0 4px; font-size: 16px; }
    .produk .harga { font-weight: bold; color: #03ac0e; margin: 6px 0; font-size: 18px; }
    .kecil { color: #666; font-size: 13px; }
    input, select { padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; max-width: 100%; }
    label { display: block; font-size: 13px; margin: 8px 0 3px; color: #444; }
    button { background: #03ac0e; color: #fff; border: 0; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 14px; }
    button:hover { background: #028a0b; }
    button.abu { background: #888; }
    button.merah { background: #d93025; }
    .form-baris { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eee; font-size: 14px; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; background: #eee; }
    .badge.menunggu_pembayaran { background: #fff3cd; }
    .badge.dibayar { background: #d1ecf1; }
    .badge.dikirim { background: #e2d9f3; }
    .badge.selesai { background: #d4edda; }
    .err { color: #d93025; }
    .kanan { text-align: right; }
    .aksi { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
    #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 18px; border-radius: 8px; display: none; z-index: 9; }
    #toast.err { background: #d93025; color: #fff; }
    .login-box { max-width: 380px; margin: 0 auto; }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <a class="logo" data-act="nav" data-v="produk">Lapakin</a>
      <nav id="nav"></nav>
    </div>
  </header>
  <main id="app">Memuat...</main>
  <div id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
